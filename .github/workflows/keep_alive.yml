name: Render Keep-Alive & Health Ping

on:
  schedule:
    # Run every 10 minutes to stay well below Render's 15-minute inactivity spin-down threshold
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      gateway_url:
        description: 'Target Base URL for Keep-Alive Ping (e.g., https://ai-agent-gateway.onrender.com)'
        required: false
        default: ''
      endpoint:
        description: 'Target Health/Ping Endpoint'
        required: false
        default: '/health'

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive-ping:
    name: Ping Gateway Health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute Keep-Alive Ping
        id: ping
        env:
          DEFAULT_URL: ${{ secrets.GATEWAY_URL || vars.GATEWAY_URL || 'https://ai-agent-gateway-sued.onrender.com' }}
          INPUT_URL: ${{ github.event.inputs.gateway_url }}
          ENDPOINT: ${{ github.event.inputs.endpoint || '/health' }}
        run: |
          TARGET_URL="${INPUT_URL:-$DEFAULT_URL}"
          echo "Sending Keep-Alive ping to: $TARGET_URL$ENDPOINT"
          python scripts/keep_alive.py \
            --url "$TARGET_URL" \
            --endpoint "$ENDPOINT" \
            --timeout 15 \
            --retries 3 \
            --backoff 2.0

      # Reuses this 10-minute cron instead of adding a second schedule: it bounds pgvector
      # index staleness at ~10 minutes even when Django's /wake webhook is lost to a cold
      # start. Never allowed to fail the job — an embeddings hiccup must not be reported
      # as the gateway being down.
      - name: Drain Pending Embeddings Outbox
        id: embeddings
        if: always()
        continue-on-error: true
        env:
          DEFAULT_URL: ${{ secrets.GATEWAY_URL || vars.GATEWAY_URL || 'https://ai-agent-gateway-sued.onrender.com' }}
          INPUT_URL: ${{ github.event.inputs.gateway_url }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          TARGET_URL="${INPUT_URL:-$DEFAULT_URL}"
          echo "Triggering embeddings ingestion at: $TARGET_URL/api/v1/internal/embeddings/process-pending"
          HTTP_CODE=$(curl -sS -o /tmp/embeddings_response.json -w '%{http_code}' \
            -X POST "$TARGET_URL/api/v1/internal/embeddings/process-pending" \
            -H "X-Internal-Secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 60 || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/embeddings_response.json 2>/dev/null || true
          echo ""
          exit 0

      - name: Publish Health Summary to GitHub Step Summary
        if: always()
        run: |
          echo "### 🌐 Render Keep-Alive Ping Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.ping.outcome == 'success' && '✅ Online / Active' || '❌ Ping Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Embeddings Ingestion**: HTTP ${{ steps.embeddings.outputs.http_code }} (non-blocking; keeps the pgvector index at most ~10 min stale)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
